name: Keep-alive

# Evita a pausa automática do projeto Supabase free tier por inatividade (§5.3.3).
# HEALTH_URL é definido em Settings → Secrets and variables → Actions → Variables
# quando o deploy existir (etapa 15). Até lá, o job roda e só avisa no log.
on:
  schedule:
    - cron: '0 12 * * 1,3,5' # segunda, quarta e sexta às 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Bater em /health
        run: |
          if [ -z "${{ vars.HEALTH_URL }}" ]; then
            echo "HEALTH_URL não configurada ainda -- nada a fazer."
            exit 0
          fi
          curl -fsS "${{ vars.HEALTH_URL }}"
