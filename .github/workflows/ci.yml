name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticketdev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ticketdev_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ticketdev_test
      JWT_ACCESS_SECRET: ci-access-secret-32-characters-xx
      JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-xx
      JWT_QR_SECRET: ci-qr-secret-32-characters-minimum-x
      # placeholder, não secret do repositório: FakePaymentProvider é o único provider
      # de pagamento em uso (orders.routes.ts) e o webhook é assinado localmente pelo
      # próprio teste (stripe.webhooks.generateTestHeaderString) -- nenhuma chamada sai
      # para api.stripe.com, então nenhuma chave real precisa existir aqui (§7.10.6).
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE: ci-placeholder-service-role-key
      TMDB_API_KEY: msw-placeholder
      GOOGLE_CLIENT_ID: msw-placeholder.apps.googleusercontent.com
      LOG_LEVEL: warn
      APP_PUBLIC_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        with:
          # histórico completo -- check:conventions varre `git log --all` procurando
          # chave da Stripe já commitada (Anexo A); um clone raso (depth 1, o padrão)
          # deixaria essa checagem sempre "limpa" mesmo que algo tivesse sido commitado
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Convenções (Anexo A)
        run: npm run check:conventions

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Migrations
        run: npm run prisma:deploy

      - name: Testes unitários
        run: npm run test:unit

      - name: Testes de integração
        run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Suíte de testes do front entra na etapa 13 do plano de front-end.
