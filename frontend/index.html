<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Aplica o tema salvo antes da primeira pintura -- sem isto, a página nasce no
         tema claro e "pisca" para o escuro um frame depois (§ etapa 02, critério de
         aceite). Só JS puro, sem import: precisa rodar antes de qualquer bundle. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ticketdev:theme')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme)
          }
        } catch (_e) {
          /* localStorage indisponível (modo privado restrito etc.) -- segue no tema do SO */
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketDev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
